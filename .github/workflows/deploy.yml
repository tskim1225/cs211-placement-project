name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main  # Triggers automatically whenever you push to the main branch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2  # Change if your region is different

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fastapi-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition fastapi-task --query taskDefinition > task-def.json
          # Remove keys that cause registration errors with older deployment actions
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("task-def.json", "utf8"));
            delete file.taskDefinitionArn;
            delete file.compatibilities;
            delete file.revision;
            delete file.status;
            delete file.requiresAttributes;
            delete file.registeredAt;
            delete file.registeredBy;
            if (file.containerDefinitions) {
              file.containerDefinitions.forEach(c => delete c.enableFaultInjection);
            }
            fs.writeFileSync("task-def.json", JSON.stringify(file, null, 2));
          '

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: fastapi-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: fastapi-cluster
          service: fastapi-service
          wait-for-service-stability: true
